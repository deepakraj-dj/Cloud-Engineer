name: Deploy Python to AWS Lambda
on:
  push:
    branches:
      - dev 
    paths: '**/Backend (Python)/registerform_final.py'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Change this to match your Lambda runtime
          
      - name: Zip only the source code
        run: |
            zip deployment.zip registerform_final.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: us-east-1 # Change to your actual AWS region

      - name: Upload zip to AWS Lambda
        run: |
         aws lambda update-function-code \
            --function-name testlogin \
            --zip-file fileb://deployment.zip
